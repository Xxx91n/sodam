name: pacman repo

# 把某个 Release 里的 .pkg.tar.zst 组织成 pacman 仓库并发布到 GitHub Pages。
#
# 用户侧只需要在 /etc/pacman.conf 末尾加：
#   [sodam]
#   SigLevel = Optional TrustAll
#   Server = https://sodahub-org.github.io/sodam/$arch
#
# 之后 `sudo pacman -Sy sodam` / `sudo pacman -Syu` 就能安装和升级。

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag，例如 v0.2.9'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，例如 v0.2.9'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pacman-repo
  cancel-in-progress: false

jobs:
  publish:
    name: 发布 [sodam] pacman 源
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载 release 里的 pacman 包
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'sodam-*.pkg.tar.zst' --dir dist
          echo "下载到 $TAG："
          ls -lh dist

      - name: 生成仓库目录（archlinux 容器内 repo-add）
        run: |
          mkdir -p public
          docker run --rm \
            -v "$PWD/dist:/dist:ro" \
            -v "$PWD/public:/public" \
            -v "$PWD/packaging/arch/mkrepo.sh:/mkrepo.sh:ro" \
            archlinux:base bash -c '
              set -euo pipefail
              command -v repo-add >/dev/null || pacman -Sy --noconfirm pacman
              bash /mkrepo.sh /dist /public'
          echo "仓库内容："
          find public -type f | sort

      - name: 生成首页与 pacman.conf 片段
        env:
          TAG: ${{ inputs.tag }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          site="https://${owner,,}.github.io/${repo}"
          printf '%s\n' \
            '[sodam]' \
            'SigLevel = Optional TrustAll' \
            "Server = ${site}/\$arch" > public/pacman.conf.snippet

          {
            printf '%s\n' '<!doctype html>' '<meta charset="utf-8">'
            printf '%s\n' '<title>SodaM pacman 仓库</title>'
            printf '%s\n' '<style>body{font:15px/1.7 system-ui,sans-serif;max-width:46rem;margin:3rem auto;padding:0 1rem;background:#141414;color:#e6e6e6}code,pre{background:#232323;border-radius:6px}pre{padding:1rem;overflow:auto}a{color:#7cc4ff}</style>'
            printf '%s\n' '<h1>SodaM pacman 仓库</h1>'
            printf '%s\n' "<p>当前发布：<code>${TAG}</code></p>"
            printf '%s\n' '<p>在 <code>/etc/pacman.conf</code> 末尾加入：</p>'
            printf '%s\n' '<pre>[sodam]'
            printf '%s\n' 'SigLevel = Optional TrustAll'
            printf '%s\n' "Server = ${site}/\$arch</pre>"
            printf '%s\n' '<p>然后安装：<code>sudo pacman -Sy sodam</code>，升级随 <code>sudo pacman -Syu</code> 一起完成。</p>'
            printf '%s\n' '<p>本仓库由 CI 在每次发版后自动重建；包内容与 GitHub Release 一致（未签名，故用 <code>Optional TrustAll</code>）。</p>'
            printf '%s\n' '<ul>'
            for arch in x86_64 aarch64; do
              [ -d "public/$arch" ] || continue
              pkg=$(cd "public/$arch" && ls *.pkg.tar.zst | head -1)
              printf '%s\n' "<li><a href=\"$arch/\">$arch</a> — ${pkg}</li>"
            done
            printf '%s\n' '</ul>'
            printf '%s\n' "<p><a href=\"pacman.conf.snippet\">pacman.conf.snippet</a> · <a href=\"https://github.com/${owner}/${repo}/releases/tag/${TAG}\">Release</a></p>"
          } > public/index.html

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
