[workspace]
resolver = "2"
members = ["crates/sodam", "crates/sodam-core"]

[workspace.package]
version = "0.3.9"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/sodahub-org/sodam"
authors = ["sodahub-org"]

[workspace.dependencies]
# gpui 依赖：临时指向个人 fork Xxx91n/gpui 的提交 353a86c
# （分支 fix/136-hover-exit-clear，修复鼠标移出窗口后标题栏悬停残留，
# 见 sodam issue #158、spec #136-1）。上游 sodahub-org/gpui 修复后可切回。
# 上游 fork 自 sonorahq/gpui（Zed gpui 新代码库），
# sonora 的丝滑滚动（Glide + Scroller + 自绘滚动条）就建立在它之上。
gpui = { git = "https://github.com/Xxx91n/gpui", rev = "353a86c", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui_platform = { git = "https://github.com/Xxx91n/gpui", rev = "353a86c", features = ["font-kit", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sys-locale = "0.3"
dirs = "6"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }

# 公开源码依赖；本地联调可选：可用 `[patch."https://github.com/sodahub-org/libresoda"]`
# 指向同级 clone，见 README「快速开始」。
libresoda = { git = "https://github.com/sodahub-org/libresoda.git", rev = "5edd2ff" }
